[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vartalap"
version = "0.1.0"
description = "Ultra-low latency real-time conversational monitor with NPU acceleration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sherpa-onnx>=1.10.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "faster-whisper>=1.2.1",
]

[project.scripts]
vartalap = "vartalap.main:main"
